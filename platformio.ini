; PlatformIO Project Configuration File for game-minerd
; Platform: Espressif 32 (ESP32 & ESP32-S3)
; Dual-core FreeRTOS: Core 0 (Mining) + Core 1 (Gaming Handheld)

[platformio]
default_envs = esp32_cyd_2432s028
src_dir = src
include_dir = include

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -O2
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    lovyan03/LovyanGFX @ ^1.1.12

; ----------------------------------------------------------------------
; 1. ESP32-2432S028R ("Cheap Yellow Display" / CYD 2.8" ILI9341 + Touch)
; ----------------------------------------------------------------------
[env:esp32_cyd_2432s028]
board = esp32dev
build_flags = 
    ${env.build_flags}
    -D BOARD_CYD_2432S028=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=240

; ----------------------------------------------------------------------
; 2. LILYGO TTGO T-Display (ESP32 1.14" ST7789)
; ----------------------------------------------------------------------
[env:ttgo_tdisplay]
board = esp32dev
build_flags = 
    ${env.build_flags}
    -D BOARD_TTGO_TDISPLAY=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240

; ----------------------------------------------------------------------
; 3. Generic ESP32 DevKit V1 (Custom Display / Breadboard Handheld)
; ----------------------------------------------------------------------
[env:esp32_devkit_v1]
board = esp32dev
build_flags = 
    ${env.build_flags}
    -D BOARD_ESP32_DEVKIT_V1=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=240
